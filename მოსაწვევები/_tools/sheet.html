<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222;display:flex;flex-wrap:wrap;gap:6px;padding:6px;width:1200px}img{width:190px;height:411px;object-fit:contain;background:#000}</style></head><body><script>
const P=new URLSearchParams(location.search),d=P.get("dir");P.get("f").split(",").forEach(f=>{const i=new Image();i.src=d+"/"+f+".jpg";document.body.appendChild(i)});
Promise.all([...document.images].map(i=>new Promise(r=>i.onload=i.onerror=r))).then(()=>window.__ready=true);
</script></body></html>
