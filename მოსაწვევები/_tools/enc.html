<!doctype html>
<html><head><meta charset="utf-8"><title>enc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@300;400;500&display=swap">
</head><body>
<script type="module">
/* enc.html?dir=..&n=..&fps=30&bg1=&bg2=&ink=&acc=&song=&aria&adelay=&l1=&l2=&cta=&noend — JPEG frames → H.264 + AAC MP4, branded end card. Result: window.__mp4 (base64). */
import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs";
const P = new URLSearchParams(location.search), dir = P.get("dir"), N = +P.get("n"), FPS = +(P.get("fps") || 30);
const BG1 = P.get("bg1") || "#FBF8F2", BG2 = P.get("bg2") || "#E9DFCF", INK = P.get("ink") || "#4A4038", ACC = P.get("acc") || "#B3A083";
const L1 = P.get("l1") || "ქორწილი · ნათლობა · დაბადების დღე", L2 = P.get("l2") || "კორპორატიული საღამოები", CTA = P.get("cta") || "შეუკვეთეთ თქვენი მოსაწვევი ✨", SUB = P.get("sub") || "3D ციფრული მოსაწვევები";
await Promise.race([Promise.all(["500 150px", "400 44px", "300 34px"].map(w => document.fonts.load(w + ' "Noto Serif Georgian"', "ამბავი"))), new Promise(r => setTimeout(r, 4000))]);
const load = async i => createImageBitmap(await (await fetch(`${dir}/${String(i).padStart(4, "0")}.jpg`)).blob());
const first = await load(0), W = first.width, H = first.height;
const FADE = P.has("noend") ? 0 : Math.round(FPS * .5), HOLD = P.has("noend") ? 0 : FPS * 3, SONG = P.get("song");
let abuf = null;
if (SONG){ const ARIA = P.has("aria"), AURL = P.get("aria") || "http://localhost:5515/_core/aria.js"; await new Promise((r, j) => { const s = document.createElement("script"); s.src = ARIA ? AURL : "http://localhost:5512/_core/js/music.js"; s.onload = r; s.onerror = j; document.head.appendChild(s); });
  abuf = await (ARIA ? Aria : Music).render(SONG, (N + FADE + HOLD) / FPS, +(P.get("adelay") || 1.6)); }
const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: FPS }, audio: abuf ? { codec: "aac", numberOfChannels: 2, sampleRate: 48000 } : undefined, fastStart: "in-memory" });
const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { window.__err = String(e); } });
enc.configure({ codec: "avc1.640033", width: W, height: H, bitrate: 9_000_000, framerate: FPS, avc: { format: "avc" } });
let idx = 0;
const push = async src => { const fr = new VideoFrame(src, { timestamp: Math.round(idx * 1e6 / FPS), duration: Math.round(1e6 / FPS) }); enc.encode(fr, { keyFrame: idx % (FPS * 2) === 0 }); fr.close(); idx++; while (enc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 5)); window.__progress = idx; };
let last = null;
for (let i = 0; i < N; i++){ const bmp = i ? await load(i) : first; await push(bmp); if (last) last.close(); last = bmp; }
const cv = new OffscreenCanvas(W, H), g = cv.getContext("2d"), S = W / 1080;
function card(k){
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, BG1); gr.addColorStop(1, BG2); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W / 2, H / 2); const z = 1 + .03 * k; g.scale(z, z); g.textAlign = "center"; g.textBaseline = "middle";
  const line = (txt, y, font, col, sp) => { g.font = font; g.fillStyle = col; if ("letterSpacing" in g) g.letterSpacing = (sp || 0) * S + "px"; g.fillText(txt, 0, y * S); };
  line("ამბავი", -190, `500 ${150 * S}px "Noto Serif Georgian"`, INK, 18);
  line(SUB, -40, `400 ${44 * S}px "Noto Serif Georgian"`, INK, 6);
  g.fillStyle = ACC; g.fillRect(-110 * S, 40 * S, 220 * S, 3 * S);
  line(L1, 120, `300 ${34 * S}px "Noto Serif Georgian"`, INK, 2);
  line(L2, 175, `300 ${34 * S}px "Noto Serif Georgian"`, INK, 2);
  line(CTA, 300, `500 ${46 * S}px "Noto Serif Georgian"`, ACC, 1);
  g.restore();
}
for (let i = 0; i < FADE; i++){ card(0); g.globalAlpha = 1 - (i + 1) / FADE; g.drawImage(last, 0, 0); g.globalAlpha = 1; await push(cv); }
for (let i = 0; i < HOLD; i++){ card(i / HOLD); await push(cv); }
await enc.flush();
if (abuf){ const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { window.__err = String(e); } });
  aenc.configure({ codec: "mp4a.40.2", sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 });
  const L = abuf.getChannelData(0), R = abuf.getChannelData(1), B = 4800;
  for (let o = 0; o < abuf.length; o += B){ const n = Math.min(B, abuf.length - o), d = new Float32Array(n * 2); d.set(L.subarray(o, o + n), 0); d.set(R.subarray(o, o + n), n);
    const ad = new AudioData({ format: "f32-planar", sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(o / 48000 * 1e6), data: d }); aenc.encode(ad); ad.close(); }
  await aenc.flush(); }
muxer.finalize();
const buf = new Uint8Array(muxer.target.buffer); let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
window.__mp4 = btoa(s); window.__done = true;
</script></body></html>
