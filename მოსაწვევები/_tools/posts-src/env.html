<!doctype html><html lang="ka"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@300;400;500;600&family=Noto+Sans+Georgian:wght@400;500&family=Corinthia:wght@700&family=Imperial+Script&family=Bonheur+Royale&family=Birthstone&family=Luxurious+Script&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* ამბავი · პრემიუმ კონვერტები — პოსტები 1080x1350: ?d=wax-seal|ribbon|bloom|stars|noir|cover */
html,body{margin:0}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:"Noto Serif Georgian",serif;color:var(--ink);background:var(--bg)}
.bg{position:absolute;inset:-80px;background:center/cover no-repeat;filter:blur(30px) brightness(var(--bb,.55)) saturate(1.15)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 85% at 50% 48%,transparent 35%,var(--vg,rgba(0,0,0,.7)))}
.frame{position:absolute;inset:26px;border:1px solid var(--ln)}.frame:after{content:"";position:absolute;inset:8px;border:1px solid var(--ln);opacity:.45}
.top{position:absolute;top:62px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font:500 17px/1 "Noto Sans Georgian";letter-spacing:.46em;color:var(--acc)}
.top i{font:italic 500 25px/1 "Cormorant Garamond";letter-spacing:.1em;color:var(--soft)}
h1{position:absolute;top:118px;left:0;right:0;margin:0;text-align:center;font:500 68px/1.1 "Noto Serif Georgian";letter-spacing:.02em}
.sc{position:absolute;top:196px;left:0;right:0;text-align:center;font:400 60px/1.1 var(--fs);color:var(--acc)}
.kind{position:absolute;top:278px;left:0;right:0;text-align:center;font:500 16px/1 "Noto Sans Georgian";letter-spacing:.34em;color:var(--soft)}
.ph{position:absolute;border-radius:34px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 0 9px #0c0b0a,0 0 0 10.5px var(--ln),0 50px 90px -30px rgba(0,0,0,.85)}
.st{position:absolute;text-align:center;font:500 17px/1.3 "Noto Serif Georgian";letter-spacing:.12em;color:var(--ink)}
.st b{display:block;margin:0 auto 8px;width:34px;height:34px;border-radius:50%;font:500 16px/34px "Noto Sans Georgian";letter-spacing:0;color:var(--btnInk);background:var(--acc)}
.arr{position:absolute;width:36px;height:2px;background:var(--acc);opacity:.7}.arr:after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:9px solid var(--acc)}
.open{position:absolute;left:90px;right:90px;top:1146px;text-align:center;font:300 24px/1.5 "Noto Serif Georgian";color:var(--ink)}
.cta{position:absolute;bottom:62px;left:0;right:0;text-align:center;font:500 24px/1 "Noto Serif Georgian";letter-spacing:.05em;color:var(--acc)}
.cv h1{top:112px;font-size:76px;background:linear-gradient(180deg,#FFF4DA,#D9AE62 70%,#A8803E);-webkit-background-clip:text;color:transparent}
.cv .sc{top:204px;font:italic 500 38px/1 "Cormorant Garamond";letter-spacing:.2em;color:var(--soft)}
.nm{position:absolute;text-align:center;font:500 18px/1.25 "Noto Serif Georgian";color:var(--ink)}
.feat{position:absolute;left:80px;right:80px;top:1078px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px}
.feat span{padding:12px 20px;border-radius:30px;font:400 18px/1 "Noto Serif Georgian";color:var(--ink);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--ln)}
.light .feat span{background:rgba(255,255,255,.5)}
</style></head><body><div id="r"></div>
<script>
const D = {
  "wax-seal": { n: "I", name: "ცვილის ბეჭედი", sc: "Wax Seal", fs: "'Corinthia'", kind: "ქორწილი · კლასიკა", open: "ბეჭედი შუაზე ტყდება, სარქველი 3D-ში იხსნება და ოქროს დამასკის სარჩულს აჩენს — ბარათი კი პირდაპირ სტუმრისკენ მოფრინავს.", c: ["#1C130C", "#F8EEDC", "#E9CC8E", "rgba(248,238,220,.72)", "rgba(233,204,142,.45)", "#2A1B10"] },
  "ribbon": { n: "II", name: "აბრეშუმის ლენტი", sc: "Silk Ribbon", fs: "'Imperial Script'", kind: "ქორწილი · საღამოს ელეგანტურობა", open: "ატლასის ფიონი იხსნება, ლენტი ჩამოსრიალდება და ზურმუხტისფერი კარები იღება — შიგნიდან ოქროს შუქი გამოდის.", c: ["#070908", "#F4ECD8", "#D9B66C", "rgba(244,236,216,.72)", "rgba(217,182,108,.45)", "#0B2A21"] },
  "bloom": { n: "III", name: "ყვავილის კონვერტი", sc: "Blossom", fs: "'Bonheur Royale'", kind: "ნიშნობა · გაზაფხული", open: "სტიკერი აიკეცება, ოთხი ფურცელი ყვავილივით იშლება და ვარდის ფურცლები ცვივა — ყველაზე ნაზი გახსნა.", c: ["#EAD8D1", "#5B3B40", "#B9707C", "rgba(91,59,64,.75)", "rgba(185,112,124,.4)", "#FFF8F6"], light: 1 },
  "stars": { n: "IV", name: "ვარსკვლავების წერილი", sc: "Little Star", fs: "'Birthstone'", kind: "ნათლობა · ბავშვის დაბადება", open: "ოქროს ძაფი ღილებიდან იხსნება, სარქველი თანავარსკვლავედების სარჩულს აჩენს და ბარათი ვარსკვლავებში ამოდის.", c: ["#060B1E", "#EEF1FA", "#E5C987", "rgba(238,241,250,.72)", "rgba(229,201,135,.45)", "#1B2A55"] },
  "noir": { n: "V", name: "ოქროს დანა", sc: "Golden Night", fs: "'Luxurious Script'", kind: "იუბილე · გალა · Black tie", open: "ოქროს ქაღალდის დანა ნაპერწკლებით ჭრის კონვერტს, ზოლი ჰაერში ტრიალებს და შავ-ოქროსფერი ბარათი ამოდის.", c: ["#080706", "#F1E6CC", "#E0BE76", "rgba(241,230,204,.7)", "rgba(224,190,118,.45)", "#15110A"] }
};
const P = new URLSearchParams(location.search), d = P.get("d") || "cover", R = document.getElementById("r"), img = s => `url(../frames/eh/${s}.jpg)`, B = document.body.style;
const set = c => { ["--bg", "--ink", "--acc", "--soft", "--ln", "--btnInk"].forEach((k, i) => B.setProperty(k, c[i])); };
const head = `<div class="frame"></div><div class="top"><span>ამბავი</span><i>Premium Envelopes</i></div>`;
if (d === "cover"){
  document.body.classList.add("cv"); set(["#0B0908", "#F4ECDC", "#E2C27E", "rgba(244,236,220,.72)", "rgba(226,194,126,.42)", "#15110A"]);
  const K = Object.keys(D), ys = [478, 440, 408, 440, 478];
  R.innerHTML = `<div class="bg" style="background-image:${img("ribbon-c")}"></div><div class="vig"></div>${head}<h1>პრემიუმ კონვერტები</h1><div class="sc">five ways to open</div>` +
    K.map((k, i) => `<div class="ph" style="left:${46 + i * 200}px;top:${ys[i]}px;width:188px;height:407px;border-radius:24px;background-image:${img(k + "-o")}"></div><div class="nm" style="left:${36 + i * 200}px;width:208px;top:${ys[i] + 432}px">${D[k].name}</div>`).join("") +
    `<div class="open" style="top:1040px">ხუთი კონვერტი, ხუთი სრულიად განსხვავებული გახსნა — ცვილის ბეჭედი, ატლასის ლენტი, ყვავილის ფურცლები, ოქროს ძაფი და ქაღალდის დანა.</div>
     <div class="feat" style="top:1162px"><span>სტუმრის სახელი კონვერტზე</span><span>მუსიკა</span><span>დადასტურება ერთი ღილაკით</span></div><div class="cta">შეუკვეთეთ თქვენი მოსაწვევი ✨</div>`;
} else {
  const v = D[d]; set(v.c); B.setProperty("--fs", v.fs); if (v.light){ document.body.classList.add("light"); B.setProperty("--bb", "1"); B.setProperty("--vg", "rgba(120,80,80,.25)"); }
  const ph = (k, x, y, w) => `<div class="ph" style="left:${x}px;top:${y}px;width:${w}px;height:${Math.round(w * 844 / 390)}px;background-image:${img(d + "-" + k)}"></div>`;
  R.innerHTML = `<div class="bg" style="background-image:${img(d + "-c")}"></div><div class="vig"></div>${head}<h1>${v.name}</h1><div class="sc">${v.sc}</div><div class="kind">${v.kind}</div>` +
    ph("c", 62, 392, 280) + ph("o", 370, 340, 340) + ph("h", 738, 392, 280) +
    `<div class="arr" style="left:338px;top:720px;width:24px"></div><div class="arr" style="left:716px;top:720px;width:24px"></div>
     <div class="st" style="left:62px;width:280px;top:1018px"><b>1</b>კონვერტი</div><div class="st" style="left:370px;width:340px;top:1090px"><b>2</b>გახსნა</div><div class="st" style="left:738px;width:280px;top:1018px"><b>3</b>მოსაწვევი</div>
     <div class="open" style="top:1178px;font-size:21px">${v.open}</div><div class="cta">შეუკვეთეთ თქვენი მოსაწვევი ✨</div>`;
}
Promise.all([document.fonts.ready, ...[...document.querySelectorAll("[style*=url]")].map(e => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = e.style.backgroundImage.slice(5, -2); }))]).then(() => setTimeout(() => window.__ready = true, 400));
</script></body></html>
