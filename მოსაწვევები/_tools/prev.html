<!doctype html><html><head><meta charset="utf-8"></head><body><script src="http://localhost:5512/_core/js/music.js"></script><script>
/* prev.html?s=name&sec=16 — renders a built-in melody offline, window.__wav = base64 WAV */
(async () => { const P = new URLSearchParams(location.search), b = await Music.render(P.get("s"), +(P.get("sec") || 16), .1);
  const n = b.length, buf = new ArrayBuffer(44 + n * 4), v = new DataView(buf), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n * 4, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, 48000, true); v.setUint32(28, 192000, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 4, true);
  const L = b.getChannelData(0), R = b.getChannelData(1); let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); const g = .9 / Math.max(peak, .05);
  for (let i = 0; i < n; i++){ v.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * g)) * 32767, true); v.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * g)) * 32767, true); }
  const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); window.__wav = btoa(s); window.__peak = peak; })().catch(e => window.__err = String(e));
</script></body></html>
